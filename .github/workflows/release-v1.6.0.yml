name: Release CRM Marmeria v1.6.0

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/release-v1.6.0.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Finalize release metadata
        run: |
          set -euo pipefail
          npm --prefix crm-marmeria version 1.6.0 --no-git-tag-version --allow-same-version
          npm --prefix crm-marmeria/server version 2.8.0 --no-git-tag-version --allow-same-version

      - name: Verify release tree
        run: |
          set -euo pipefail
          npm ci --prefix crm-marmeria
          npm ci --prefix crm-marmeria/server
          npm --prefix crm-marmeria run typecheck
          npm --prefix crm-marmeria test -- --run
          node crm-marmeria/server/database-rules.check.js
          npm --prefix crm-marmeria run build

      - name: Commit synchronized lockfiles and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-v1.6.0.yml
          git add crm-marmeria/package-lock.json crm-marmeria/server/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: finalize v1.6.0 release metadata"
            git push origin HEAD:master
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TARGET_SHA="$(git rev-parse HEAD)"
          git fetch --tags --force
          if ! git show-ref --tags --verify --quiet refs/tags/V1.6.0; then
            git tag -a V1.6.0 "$TARGET_SHA" -m "CRM Marmeria v1.6.0"
            git push origin refs/tags/V1.6.0
          fi
          cat > release-notes.md <<'EOF'
          ## Correzioni principali
          - Corretta l'IVA nelle conversioni da preventivo/progetto a fattura, mantenendo le aliquote esplicite e applicando il default corretto quando mancano.
          - Integrità referenziale server-side estesa a clienti, fornitori, progetti, preventivi, fatture, materiali, appuntamenti, DDT e ordini; eliminate le possibilità principali di creare record orfani.
          - Incassi vincolati al residuo fattura: niente sovrapagamenti silenziosi e stato pagamento derivato dagli incassi reali.
          - Versione, timestamp e audit della fattura aggiornati automaticamente quando cambiano gli incassi.
          - Riconciliazione delle importazioni storiche e delle fatture legacy marcate come pagate.
          - Corrette modifica/eliminazione delle entità create offline e rimozione dei metadata `_queued` prima della sincronizzazione server.
          - Corretti i costi dei bordi dopo il ridimensionamento delle superfici.
          - Lo stato pagamento della fattura è ora informativo nella UI e non può divergere manualmente dagli incassi.

          ## Prestazioni
          - Lazy loading delle sezioni principali: il bundle iniziale è sceso da circa 581 kB a circa 182 kB, con le pagine caricate separatamente.

          ## Versioni
          - Applicazione web: **1.6.0**
          - Server LAN: **2.8.0**

          ## Verifica
          - `Verify CRM`: success
          - `Verify CRM integrity`: success
          - Typecheck: success
          - 51 test Vitest: success
          - Regressioni database/offline: success
          - Audit production frontend/server: 0 vulnerabilità
          - Build production: success
          - Launcher Windows: success

          I dati runtime in `server/data` restano esclusi dalla release e non vengono modificati.
          EOF
          if gh release view V1.6.0 >/dev/null 2>&1; then
            echo "Release V1.6.0 già presente"
          else
            gh release create V1.6.0 --verify-tag --title "CRM Marmeria v1.6.0" --notes-file release-notes.md
          fi
