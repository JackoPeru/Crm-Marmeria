name: Diagnose fourth frontend patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose frontend patch
        id: patch
        continue-on-error: true
        run: python3 crm-marmeria/scripts/apply-fourth-frontend.py > crm-marmeria/frontend-patch-report.txt 2>&1

      - name: Upload frontend patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-patch-report
          path: crm-marmeria/frontend-patch-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce patch result
        if: steps.patch.outcome == 'failure'
        working-directory: crm-marmeria
        run: |
          cat frontend-patch-report.txt
          exit 1
