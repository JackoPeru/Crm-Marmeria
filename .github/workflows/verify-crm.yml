name: Diagnose fifth offline patch

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Capture patch mismatch
        id: patch
        continue-on-error: true
        run: python3 crm-marmeria/scripts/apply-fifth-offline.py > crm-marmeria/fifth-offline-patch.txt 2>&1

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fifth-offline-patch
          path: crm-marmeria/fifth-offline-patch.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce result
        if: steps.patch.outcome == 'failure'
        working-directory: crm-marmeria
        run: |
          cat fifth-offline-patch.txt
          exit 1
