name: Verify CRM

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-marmeria
    env:
      TZ: Europe/Rome

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install clean dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Verify dependency bootstrap
        run: node verifica-dipendenze.cjs

      - name: Verify access policy
        run: node server/access-policy.check.js

      - name: Verify restore validation
        run: node server/restore-validation.check.js

      - name: Verify shutdown runtime
        run: node server/shutdown-runtime.check.js

      - name: Verify mutation barrier
        run: node server/mutation-barrier.check.js

      - name: Verify server bootstrap smoke
        run: node server/smoke-test.js server

      - name: Check server app syntax
        run: node --check server/app.js

      - name: Check server database syntax
        run: node --check server/database.js

      - name: Check restore safety syntax
        run: node --check server/restore-safety.js

      - name: Check shutdown runtime syntax
        run: node --check server/shutdown-runtime.js

      - name: Check access policy syntax
        run: node --check server/access-policy.js

      - name: Verify runtime files
        run: node server/runtime-files.check.js

      - name: Verify standalone index bootstrap
        run: node server/index-bootstrap.check.js

      - name: Verify server setup
        run: node server/setup-test.js

      - name: Smoke create
        run: node server/smoke-test.js create

      - name: Smoke update
        run: node server/smoke-test.js update

      - name: Smoke conflict
        run: node server/smoke-test.js conflict

      - name: Smoke integrity
        run: node server/smoke-test.js integrity

      - name: Smoke snapshot
        run: node server/smoke-test.js snapshot

      - name: Typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test -- --run

      - name: Audit application production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Audit server production dependencies
        run: npm audit --prefix server --omit=dev --audit-level=low

      - name: Build web application
        run: npm run build

  verify-windows-launcher:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify single Windows launcher
        shell: pwsh
        run: |
          $launcher = 'crm-marmeria/avvia-server-lan.cmd'
          if (-not (Test-Path $launcher)) { throw 'Launcher unico mancante.' }
          foreach ($obsolete in 'crm-marmeria/avvia-server-lan.ps1', 'crm-marmeria/avvia-server-lan-runner.cmd') {
            if (Test-Path $obsolete) { throw "Launcher obsoleto presente: $obsolete" }
          }
          $content = Get-Content -Raw $launcher
          foreach ($required in 'OpenJS.NodeJS.LTS', 'Git.Git', 'Repair-WinGetPackageManager', '--serve', 'verifica-dipendenze.cjs') {
            if ($content -notmatch [regex]::Escape($required)) { throw "Bootstrap incompleto: $required" }
          }

      - name: Verify Node and npm standard path fallback
        shell: pwsh
        run: |
          $fakeProgramFiles = Join-Path $env:RUNNER_TEMP 'Program Files'
          $nodeDirectory = Join-Path $fakeProgramFiles 'nodejs'
          New-Item -ItemType Directory -Force -Path $nodeDirectory | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $nodeDirectory 'node.exe') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $nodeDirectory 'npm.cmd') | Out-Null

          $systemPath = Join-Path $env:SystemRoot 'System32'
          $command = 'set "ProgramFiles={0}" && set "PATH={1}" && call "crm-marmeria\avvia-server-lan.cmd" --check' -f $fakeProgramFiles, $systemPath
          cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
