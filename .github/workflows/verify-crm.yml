name: Refresh SQLite lockfiles

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh lockfiles without native scripts
        working-directory: crm-marmeria
        run: |
          npm install --ignore-scripts
          npm install --prefix server --ignore-scripts

      - name: Build standalone native modules
        id: standalone_native
        continue-on-error: true
        working-directory: crm-marmeria
        run: npm rebuild --prefix server bcrypt better-sqlite3 > standalone-native-report.txt 2>&1

      - name: Build Electron native modules
        id: electron_native_build
        continue-on-error: true
        working-directory: crm-marmeria
        run: npx electron-builder install-app-deps > electron-native-build-report.txt 2>&1

      - name: Upload native build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-build-reports
          path: |
            crm-marmeria/standalone-native-report.txt
            crm-marmeria/electron-native-build-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce native builds
        if: steps.standalone_native.outcome == 'failure' || steps.electron_native_build.outcome == 'failure'
        working-directory: crm-marmeria
        run: |
          cat standalone-native-report.txt
          cat electron-native-build-report.txt
          exit 1

      - name: Verify Electron 43 native modules and core tests
        working-directory: crm-marmeria
        env:
          TZ: Europe/Rome
        run: |
          node server/setup-test.js
          node server/smoke-test.js snapshot
          node server/smoke-test.js server
          npm run typecheck
          npm test -- --run
          timeout 30s xvfb-run -a ./node_modules/.bin/electron electron/native-smoke.cjs --no-sandbox
          npm run build
          timeout 180s npx electron-builder --linux dir --publish never

      - name: Commit refreshed lockfiles
        run: |
          git checkout -- .github/workflows/verify-crm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crm-marmeria/package-lock.json crm-marmeria/server/package-lock.json
          git commit -m "chore: refresh SQLite native dependency lockfiles"
          git push origin HEAD:fix/core-reliability-2026-07
