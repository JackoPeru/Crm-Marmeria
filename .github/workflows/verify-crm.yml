name: Apply fourth server review

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply fourth-run server patch
        run: python3 crm-marmeria/scripts/apply-fourth-server.py

      - name: Install dependencies
        working-directory: crm-marmeria
        run: |
          npm ci
          npm ci --prefix server

      - name: Verify patched server and application
        working-directory: crm-marmeria
        env:
          TZ: Europe/Rome
        run: |
          node --check server/app.js
          node --check server/database.js
          node --check server/restore-safety.js
          node --check server/mutation-barrier.js
          node --check server/middleware/auth.js
          node --check electron/main.cjs
          node --check electron/discovery.cjs
          node electron/network-config.test.cjs
          node server/mutation-barrier.test.js
          node server/setup-test.js
          node server/smoke-test.js create
          node server/smoke-test.js update
          node server/smoke-test.js conflict
          node server/smoke-test.js integrity
          node server/smoke-test.js snapshot
          node server/smoke-test.js server
          npm run typecheck
          npm test -- --run
          timeout 30s xvfb-run -a ./node_modules/.bin/electron electron/native-smoke.cjs --no-sandbox
          npm run build
          timeout 180s npx electron-builder --linux dir --publish never

      - name: Commit verified server patch
        run: |
          git rm crm-marmeria/scripts/apply-fourth-server.py
          git checkout -- .github/workflows/verify-crm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: harden maintenance, sessions and restore consistency"
          git push origin HEAD:fix/core-reliability-2026-07
