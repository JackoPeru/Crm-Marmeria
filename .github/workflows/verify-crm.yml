name: Diagnose fifth offline verification

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply patch and install
        run: |
          python3 crm-marmeria/scripts/apply-fifth-offline-v2.py
          cd crm-marmeria
          npm ci

      - name: Capture focused verification
        id: verify
        continue-on-error: true
        working-directory: crm-marmeria
        run: |
          set +e
          : > fifth-offline-verification.txt
          run_check() {
            echo "===== $* =====" | tee -a fifth-offline-verification.txt
            "$@" >> fifth-offline-verification.txt 2>&1
            code=$?
            echo "EXIT=$code" | tee -a fifth-offline-verification.txt
            return $code
          }
          run_check npm test -- --run src/services/optimisticMutation.test.ts src/services/requestScope.test.ts src/services/offlineQueue.test.ts || exit $?
          run_check npm run typecheck || exit $?

      - name: Upload focused verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fifth-offline-verification
          path: crm-marmeria/fifth-offline-verification.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce verification result
        if: steps.verify.outcome == 'failure'
        working-directory: crm-marmeria
        run: |
          cat fifth-offline-verification.txt
          exit 1
