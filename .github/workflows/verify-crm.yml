name: Diagnose SQLite lockfile refresh

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Diagnose root lockfile refresh
        id: root_lock
        continue-on-error: true
        working-directory: crm-marmeria
        run: npm install --ignore-scripts > root-lock-report.txt 2>&1

      - name: Diagnose server lockfile refresh
        id: server_lock
        continue-on-error: true
        working-directory: crm-marmeria
        run: npm install --prefix server --ignore-scripts > server-lock-report.txt 2>&1

      - name: Upload lockfile reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-refresh-reports
          path: |
            crm-marmeria/root-lock-report.txt
            crm-marmeria/server-lock-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce resolution result
        if: steps.root_lock.outcome == 'failure' || steps.server_lock.outcome == 'failure'
        working-directory: crm-marmeria
        run: |
          cat root-lock-report.txt
          cat server-lock-report.txt
          exit 1
