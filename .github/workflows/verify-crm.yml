name: Verify CRM

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-marmeria

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate patched package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Upload patched package lock
        uses: actions/upload-artifact@v4
        with:
          name: package-lock-js-yaml-4.3.0
          path: crm-marmeria/package-lock.json
          if-no-files-found: error
          retention-days: 1
