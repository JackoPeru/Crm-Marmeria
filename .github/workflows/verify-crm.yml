name: Diagnose fourth server review

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply fourth-run server patch
        run: python3 crm-marmeria/scripts/apply-fourth-server.py

      - name: Install dependencies
        working-directory: crm-marmeria
        run: |
          npm ci
          npm ci --prefix server

      - name: Run diagnostic verification
        id: verify
        continue-on-error: true
        working-directory: crm-marmeria
        env:
          TZ: Europe/Rome
        run: |
          set +e
          : > fourth-server-report.txt
          run_test() {
            echo "===== $* =====" | tee -a fourth-server-report.txt
            "$@" >> fourth-server-report.txt 2>&1
            code=$?
            echo "EXIT=$code" | tee -a fourth-server-report.txt
            if [ "$code" -ne 0 ]; then exit "$code"; fi
          }
          run_test node --check server/app.js
          run_test node --check server/database.js
          run_test node --check server/restore-safety.js
          run_test node --check server/mutation-barrier.js
          run_test node --check server/middleware/auth.js
          run_test node --check electron/main.cjs
          run_test node --check electron/discovery.cjs
          run_test node electron/network-config.test.cjs
          run_test node server/mutation-barrier.test.js
          run_test node server/setup-test.js
          run_test node server/smoke-test.js create
          run_test node server/smoke-test.js update
          run_test node server/smoke-test.js conflict
          run_test node server/smoke-test.js integrity
          run_test node server/smoke-test.js snapshot
          run_test node server/smoke-test.js server
          run_test npm run typecheck
          run_test npm test -- --run
          run_test timeout 30s xvfb-run -a ./node_modules/.bin/electron electron/native-smoke.cjs --no-sandbox
          run_test npm run build
          run_test timeout 180s npx electron-builder --linux dir --publish never

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fourth-server-report
          path: crm-marmeria/fourth-server-report.txt
          if-no-files-found: error
          retention-days: 3

      - name: Enforce verification result
        if: steps.verify.outcome == 'failure'
        working-directory: crm-marmeria
        run: |
          cat fourth-server-report.txt
          exit 1
