name: Verify CRM Marmeria

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - fix/core-reliability-2026-07

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-marmeria
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crm-marmeria/package.json

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: |
          node --check server/index.js
          node --check server/app.js
          node --check server/database.js
          node --check server/middleware/auth.js
          node --check electron/main.cjs
          node --check electron/server.cjs
          node --check electron/discovery.cjs
          node --check electron/preload.cjs

      - name: Test SQLite CRUD and conflicts
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { CrmDatabase } = require('./server/database');
          const root = fs.mkdtempSync(path.join(os.tmpdir(), 'crm-marmeria-crud-'));
          const db = new CrmDatabase({
            dataDir: path.join(root, 'data'),
            backupDir: path.join(root, 'backups'),
            attachmentsDir: path.join(root, 'attachments'),
          });
          const user = { id: 'ci', username: 'ci' };
          const created = db.create('project', { name: 'Test CI', status: 'In Attesa' }, user, 'ci-create');
          assert.equal(created.item.version, 1, 'La creazione deve partire dalla versione 1');
          const updated = db.update('project', created.item.id, { status: 'Completato' }, 1, user, 'ci-update');
          assert.equal(updated.item.version, 2, 'L’aggiornamento deve incrementare la versione');
          let conflictDetected = false;
          try {
            db.update('project', created.item.id, { status: 'In Corso' }, 1, user, 'ci-conflict');
          } catch (error) {
            conflictDetected = error.status === 409;
          }
          assert.equal(conflictDetected, true, 'Una versione obsoleta deve produrre conflitto 409');
          db.close();
          fs.rmSync(root, { recursive: true, force: true });
          NODE

      - name: Test SQLite snapshot backup
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { CrmDatabase } = require('./server/database');
          (async () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'crm-marmeria-backup-'));
            const db = new CrmDatabase({
              dataDir: path.join(root, 'data'),
              backupDir: path.join(root, 'backups'),
              attachmentsDir: path.join(root, 'attachments'),
            });
            db.create('project', { name: 'Backup CI' }, { id: 'ci', username: 'ci' }, 'backup-create');
            const snapshot = await db.createSnapshot('ci');
            assert.ok(snapshot.name, 'Il backup deve restituire un nome');
            assert.ok(fs.existsSync(path.join(root, 'backups', snapshot.name, 'crm-marmeria.db')), 'Il file SQLite del backup deve esistere');
            assert.ok(db.listSnapshots().some((item) => item.name === snapshot.name), 'Il backup deve essere elencato');
            db.close();
            fs.rmSync(root, { recursive: true, force: true });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Test central server health
        run: |
          node <<'NODE'
          const assert = require('assert');
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const { createCrmServer } = require('./server/app');
          (async () => {
            const root = fs.mkdtempSync(path.join(os.tmpdir(), 'crm-marmeria-server-'));
            const instance = await createCrmServer({
              port: 32123,
              host: '127.0.0.1',
              dataDir: path.join(root, 'data'),
              backupDir: path.join(root, 'backups'),
              attachmentsDir: path.join(root, 'attachments'),
              serverName: 'CI',
            });
            const response = await fetch('http://127.0.0.1:32123/api/health');
            assert.equal(response.ok, true, 'L’endpoint health deve rispondere');
            const body = await response.json();
            assert.equal(body.mode, 'central-server');
            await instance.close();
            fs.rmSync(root, { recursive: true, force: true });
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Build frontend
        run: npm run build
