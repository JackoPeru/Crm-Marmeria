name: Inspect transitive security versions

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Query npm registry
        working-directory: crm-marmeria
        run: |
          npm view lodash versions --json > lodash-versions.json
          npm view path-to-regexp versions --json > path-to-regexp-versions.json

      - name: Upload registry versions
        uses: actions/upload-artifact@v4
        with:
          name: transitive-registry-versions
          path: |
            crm-marmeria/lodash-versions.json
            crm-marmeria/path-to-regexp-versions.json
          if-no-files-found: error
          retention-days: 3
