name: Apply fifth independent review

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply fifth-run patch
        run: python3 crm-marmeria/scripts/apply-fifth-review.py

      - name: Install clean dependencies
        working-directory: crm-marmeria
        run: |
          npm ci
          npm ci --prefix server

      - name: Verify fifth-run regressions first
        working-directory: crm-marmeria
        run: |
          node --check electron/main.cjs
          node --check electron/main-helpers.cjs
          node --check electron/server.cjs
          node --check electron/server-identity.cjs
          node electron/main-helpers.check.cjs
          node electron/main-bootstrap.check.cjs
          node electron/server-identity.check.cjs
          node electron/server-master.check.cjs
          npm test -- --run src/services/requestScope.test.ts src/services/offlineQueue.test.ts
          node server/setup-test.js
          node server/smoke-test.js integrity
          node server/smoke-test.js server

      - name: Verify complete application
        working-directory: crm-marmeria
        env:
          TZ: Europe/Rome
        run: |
          node --check server/index.js
          node --check server/app.js
          node --check server/database.js
          node --check server/restore-safety.js
          node --check server/mutation-barrier.js
          node --check server/middleware/auth.js
          node --check server/snapshot-compat.js
          node --check server/smoke-test.js
          node --check server/setup-test.js
          node --check electron/discovery.cjs
          node --check electron/network-config.cjs
          node --check electron/preload.cjs
          node electron/network-config.check.cjs
          node server/mutation-barrier.check.js
          node server/smoke-test.js create
          node server/smoke-test.js update
          node server/smoke-test.js conflict
          node server/smoke-test.js snapshot
          npm run typecheck
          npm test -- --run
          timeout 30s xvfb-run -a ./node_modules/.bin/electron electron/native-smoke.cjs --no-sandbox
          npm audit --omit=dev --audit-level=low
          npm audit --prefix server --omit=dev --audit-level=low
          npm run build
          timeout 180s npx electron-builder --linux dir --publish never

      - name: Inspect packaged runtime
        working-directory: crm-marmeria
        run: |
          node - <<'NODE'
          const path = require('path');
          const asar = require('@electron/asar');
          const archive = path.join('dist-electron', 'linux-unpacked', 'resources', 'app.asar');
          const entries = asar.listPackage(archive)
            .map((entry) => entry.replace(/^[\\/]/, '').replace(/\\/g, '/'));
          for (const item of [
            'electron/main.cjs',
            'electron/main-helpers.cjs',
            'electron/server-identity.cjs',
            'server/app.js',
            'server/database.js',
          ]) {
            if (!entries.includes(item)) throw new Error(`File runtime mancante: ${item}`);
          }
          for (const item of [
            'electron/main-bootstrap.check.cjs',
            'electron/main-helpers.check.cjs',
            'electron/server-master.check.cjs',
            'server/smoke-test.js',
            'server/setup-test.js',
            'server/data/users.json',
          ]) {
            if (entries.includes(item)) throw new Error(`File di test incluso: ${item}`);
          }
          NODE

      - name: Commit verified fifth-run patch
        run: |
          git rm crm-marmeria/scripts/apply-fifth-review.py
          git rm -f crm-marmeria/root-audit.json crm-marmeria/server-audit.json || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: close fifth-run runtime and data-safety gaps"
          git push origin HEAD:fix/core-reliability-2026-07
