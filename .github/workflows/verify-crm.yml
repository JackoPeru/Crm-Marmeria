name: Apply and verify third review

on:
  push:
    branches:
      - fix/core-reliability-2026-07

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply deterministic source patches
        run: python3 crm-marmeria/scripts/apply-third-review.py

      - name: Upgrade supported runtime and upload middleware
        working-directory: crm-marmeria
        run: |
          npm install --save-dev electron@43.1.0
          npm install multer@2.2.0
          npm install --prefix server multer@2.2.0

      - name: Verify destructive and security cases before commit
        working-directory: crm-marmeria
        env:
          TZ: Europe/Rome
        run: |
          node --check server/app.js
          node --check server/database.js
          node --check server/restore-safety.js
          node --check electron/main.cjs
          node --check electron/server.cjs
          node server/setup-test.js
          node server/smoke-test.js snapshot
          node server/smoke-test.js server
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Commit verified third-review fixes
        run: |
          git rm crm-marmeria/scripts/apply-third-review.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: harden restore, setup, LAN identity and supported runtime"
          git push origin HEAD:fix/core-reliability-2026-07
