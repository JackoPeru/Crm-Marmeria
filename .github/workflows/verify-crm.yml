name: Apply sixth core review

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply sixth-run core patches
        run: |
          python3 crm-marmeria/scripts/apply-sixth-network.py
          python3 crm-marmeria/scripts/apply-sixth-access.py
          python3 crm-marmeria/scripts/apply-sixth-restore.py
          python3 crm-marmeria/scripts/apply-sixth-shutdown.py

      - name: Install clean dependencies
        working-directory: crm-marmeria
        run: |
          npm ci
          npm ci --prefix server

      - name: Verify newly discovered regressions
        working-directory: crm-marmeria
        env:
          TZ: Europe/Rome
        run: |
          node electron/automatic-mode.check.cjs
          node server/access-policy.check.js
          node server/restore-validation.check.js
          node server/shutdown-runtime.check.js
          node server/mutation-barrier.check.js
          node server/smoke-test.js server

      - name: Verify complete application
        working-directory: crm-marmeria
        env:
          TZ: Europe/Rome
        run: |
          node --check electron/main.cjs
          node --check electron/network-config.cjs
          node --check server/app.js
          node --check server/database.js
          node --check server/restore-safety.js
          node --check server/shutdown-runtime.js
          node --check server/access-policy.js
          node electron/main-helpers.check.cjs
          node electron/main-bootstrap.check.cjs
          node electron/server-identity.check.cjs
          node electron/server-master.check.cjs
          node electron/network-config.check.cjs
          node server/runtime-files.check.js
          node server/index-bootstrap.check.js
          node server/setup-test.js
          node server/smoke-test.js create
          node server/smoke-test.js update
          node server/smoke-test.js conflict
          node server/smoke-test.js integrity
          node server/smoke-test.js snapshot
          npm run typecheck
          npm test -- --run
          npm audit --omit=dev --audit-level=low
          npm audit --prefix server --omit=dev --audit-level=low
          timeout 30s xvfb-run -a ./node_modules/.bin/electron electron/native-smoke.cjs --no-sandbox
          npm run build
          timeout 180s npx electron-builder --linux dir --publish never

      - name: Commit verified sixth-run core fixes
        run: |
          git rm crm-marmeria/scripts/apply-sixth-network.py crm-marmeria/scripts/apply-sixth-access.py crm-marmeria/scripts/apply-sixth-restore.py crm-marmeria/scripts/apply-sixth-shutdown.py
          git checkout -- .github/workflows/verify-crm.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: close sixth-run network, access and recovery gaps"
          git push origin HEAD:fix/core-reliability-2026-07
