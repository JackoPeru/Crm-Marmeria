name: Inspect SQLite registry versions

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Query npm registry
        working-directory: crm-marmeria
        run: |
          npm view better-sqlite3 versions --json > better-sqlite3-versions.json
          npm view electron versions --json > electron-versions.json

      - name: Upload registry versions
        uses: actions/upload-artifact@v4
        with:
          name: registry-versions
          path: |
            crm-marmeria/better-sqlite3-versions.json
            crm-marmeria/electron-versions.json
          if-no-files-found: error
          retention-days: 3
