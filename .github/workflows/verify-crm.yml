name: Diagnose standalone audit

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply frontend patch and install
        run: |
          python3 crm-marmeria/scripts/apply-fourth-frontend.py
          cd crm-marmeria
          npm ci
          npm install --prefix server

      - name: Produce audit reports
        working-directory: crm-marmeria
        run: |
          npm audit --omit=dev --json > root-audit.json || true
          npm audit --prefix server --omit=dev --json > server-audit.json || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: fourth-audit-reports
          path: |
            crm-marmeria/root-audit.json
            crm-marmeria/server-audit.json
          if-no-files-found: error
          retention-days: 3
