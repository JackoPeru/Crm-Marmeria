name: Diagnose production dependency upgrade

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: fix/core-reliability-2026-07

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Upgrade direct production dependencies
        working-directory: crm-marmeria
        run: |
          npm uninstall react-router-dom
          npm install axios@latest bcrypt@6.0.0 express@4.22.2 ws@latest
          npm install --prefix server bcrypt@6.0.0 express@4.22.2 ws@latest

      - name: Produce production audit
        working-directory: crm-marmeria
        run: npm audit --omit=dev --json > upgraded-production-audit.json || true

      - name: Upload upgraded audit
        uses: actions/upload-artifact@v4
        with:
          name: upgraded-production-audit
          path: crm-marmeria/upgraded-production-audit.json
          if-no-files-found: error
          retention-days: 3
