      - name: Upgrade Electron to a supported stable line
        working-directory: crm-marmeria
        run: npm install --save-dev electron@43.1.0

      - name: Verify patch locally
        working-directory: crm-marmeria
        run: |
          npm install --prefix server
          node --check server/app.js
          node --check server/database.js
          node --check server/restore-safety.js
          node server/smoke-test.js snapshot
          node server/smoke-test.js server
          npm run typecheck
          npm test -- --run
          npm run build

      - name: Commit generated fixes and remove temporary workflow
        run: |
          git rm .github/workflows/apply-third-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: harden restore, LAN identity, dates and Electron runtime"
          git push origin HEAD:fix/core-reliability-2026-07
